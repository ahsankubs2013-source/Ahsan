<style>
:root{
  --teal:#0f6b60; --teal-d:#0b4f48; --teal-l:#e3f1ee; --green:#7ac143; --cyan:#2bb3e0;
  --ink:#13302c; --muted:#5d7571; --line:#e0e9e7; --bg:#f3f6f5; --card:#ffffff; --hover:#f6faf9;
  --ok:#2f7d32; --ok-bg:#e6f4e4; --warn:#9a6700; --warn-bg:#fff3d6; --bad:#b3261e; --bad-bg:#fde7e5; --info:#0b6a8f; --info-bg:#e1f3fa; --gray-bg:#eceff0;
  --shadow:0 1px 2px rgba(15,60,55,.06),0 4px 14px rgba(15,60,55,.05);
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e4efed;--muted:#9bb3af;--line:#27403c;--bg:#0d1b19;--card:#132623;--hover:#17302c;--teal-l:#173a35;
    --ok-bg:#183a1c;--ok:#8fd694;--warn-bg:#41330d;--warn:#f0c15a;--bad-bg:#44201d;--bad:#ff9a92;--info-bg:#10364a;--info:#7fd0f0;--gray-bg:#223532;--teal:#2aa595;--teal-d:#1d8274}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.brand .logo{background:#fff;border-radius:14px;padding:8px 10px;display:grid;place-items:center}
.brand img{width:86px;height:auto;display:block}
.brand small{color:var(--muted);font-size:12px;text-align:center}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:9px;padding:9px 11px;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.on{background:var(--teal-l);color:var(--teal);font-weight:600}
.nav .grp{font-size:12px;color:var(--muted);padding:12px 11px 4px;font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 4px}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 28px 10px}
.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px;margin-top:1px}
.top .grow{flex:1;min-width:200px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--gray-bg);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.live{background:var(--ok-bg);color:var(--ok)} .pill.demo{background:var(--warn-bg);color:var(--warn)} .pill.err{background:var(--bad-bg);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--hover)} .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff} .btn.primary:hover{background:var(--teal-d)}
.btn.sm{padding:4px 10px;font-size:12px} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
select,input[type=text],input[type=date],input[type=number],input[type=password],input[type=search],textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 10px;min-width:0}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:64px}
#view{padding:6px 28px 40px;display:flex;flex-direction:column;gap:18px}
.banner{margin:0 28px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h2{font-size:15px;margin:0 0 4px;font-weight:700}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .l{color:var(--muted);font-size:13px}
.stat .d{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--gray-bg);overflow:hidden;display:flex}
.bar>i{display:block;height:100%}
.c-cur{background:var(--teal)} .c-inc{background:var(--cyan)} .c-hire{background:#f0b64a} .c-gray{background:#9aa9a6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c,#999)}
.rows{display:flex;flex-direction:column;gap:11px}
.row{display:grid;grid-template-columns:175px 1fr 64px;gap:12px;align-items:center;font-size:13px}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:12px;height:150px;padding-top:8px}
.cols .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--muted);text-align:center}
.cols .col b{color:var(--ink);font-size:13px}
.cols .col i{display:block;width:100%;max-width:56px;border-radius:7px 7px 0 0;background:var(--teal);min-height:3px}
.empty{color:var(--muted);padding:16px 0;text-align:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:calc(100vh - 230px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default;z-index:1}
th.sort{cursor:pointer} th.sort:hover{color:var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--hover)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .sub{color:var(--muted);font-size:12px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--gray-bg);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.steps{display:flex;gap:2px;margin-top:5px} .steps i{width:9px;height:4px;border-radius:2px;background:var(--line)} .steps i.on{background:var(--teal)}
.tag-esc{font-size:11px;color:var(--warn);font-weight:600}
/* org tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:22px;padding-left:18px;border-left:2px solid var(--line)}
.tree li{position:relative;padding:5px 0}
.tree ul>li:before{content:"";position:absolute;left:-18px;top:27px;width:16px;border-top:2px solid var(--line)}
.node{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:8px 12px;cursor:pointer;max-width:620px}
.node:hover{background:var(--hover)}
.node.s-Incoming{border-left-color:var(--cyan)} .node.s-Projected{border-left-color:#f0b64a;border-style:dashed;border-left-style:solid} .node.s-Not{border-left-color:#9aa9a6}
.node .tog{border:0;background:var(--gray-bg);border-radius:6px;width:22px;height:22px;cursor:pointer;flex:none;line-height:1;color:var(--muted)}
.node .tog.empty{visibility:hidden}
.node .main{flex:1;min-width:0} .node .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .node .main span{color:var(--muted);font-size:12.5px}
.node .meta{font-size:12px;color:var(--muted);white-space:nowrap}
/* drawer & dialog */
.scrim{position:fixed;inset:0;background:rgba(10,30,27,.35);display:none;z-index:40} .scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--card);box-shadow:-8px 0 30px rgba(0,0,0,.18);transform:translateX(102%);transition:transform .22s ease;z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:17px} .drawer header .x{margin-left:auto}
.drawer .body{padding:16px 20px 30px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;margin:0} .dl dt{color:var(--muted)} .dl dd{margin:0}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.crumbs button{border:0;background:var(--gray-bg);border-radius:99px;padding:3px 10px;cursor:pointer}
.crumbs span{color:var(--muted)}
.sec h4{margin:0 0 8px;font-size:13.5px}
dialog{border:0;border-radius:16px;padding:0;width:min(760px,96vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,30,27,.45)}
dialog form{display:flex;flex-direction:column;max-height:92vh}
dialog .dh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start} dialog .dh h3{margin:0;font-size:17px}
dialog .db{padding:16px 22px;overflow:auto;display:flex;flex-direction:column;gap:16px}
dialog .df{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px} .f label{font-weight:600;font-size:13px} .f .h{font-size:12px;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dim{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dim .t{display:flex;justify-content:space-between;gap:10px;font-weight:600} .dim .t span{color:var(--muted);font-weight:500;font-size:12.5px}
.seg{display:flex;gap:6px} .seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 0;cursor:pointer;font-weight:700} .seg button:hover{background:var(--hover)} .seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)} .seg button:disabled{cursor:not-allowed;opacity:.7}
.anchors{font-size:12px;color:var(--muted);display:grid;gap:2px}
.score{display:flex;align-items:center;gap:14px;background:var(--teal-l);border-radius:12px;padding:12px 16px}
.score .big{font-size:30px;font-weight:700;color:var(--teal);line-height:1}
.err{color:var(--bad);font-size:13px;font-weight:500}
.checks{display:flex;flex-direction:column}
.check{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0} .check .t{font-weight:600} .check .d{color:var(--muted);font-size:12.5px;margin-top:2px}
.check ul{margin:6px 0 0;padding-left:18px;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:80;font-weight:500}
#toast.on{opacity:1;transform:translateX(-50%)}
.menu-btn{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr} .side{position:fixed;z-index:30;left:0;width:250px;transform:translateX(-102%);transition:transform .2s} .side.on{transform:none}
  .menu-btn{display:inline-flex} .g2{grid-template-columns:1fr} .top,#view{padding-left:16px;padding-right:16px} .banner{margin:0 16px}
  .row{grid-template-columns:110px 1fr 60px} .f2{grid-template-columns:1fr} .dl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.top .btn,.menu-btn{display:none!important}.app{display:block}}
</style>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);

const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-');

function downloadCSV(name, rows){
  if(!rows.length) return;
  const cols = Object.keys(rows[0]);
  const q = v => '"'+String(v ?? '').replace(/"/g,'""')+'"';
  const csv = [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'})); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- API ---------- */
async function apiGet(){
  const u = state.conn.url + (state.conn.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(state.conn.key);
  const res = await fetch(u, {method:'GET', redirect:'follow'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'Backend error');
  return j;
}
async function apiPost(action, payload){
  const res = await fetch(state.conn.url, {method:'POST', redirect:'follow', body: JSON.stringify({key:state.conn.key, user:state.conn.user, action, payload})});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || 'Save failed');
  return j;
}
async function load(){
  if(!state.conn.url){
    state.mode='demo'; state.role='demo'; state.raw=JSON.parse(JSON.stringify(DEMO_DATA)); state.error='';
  } else {
    try{
      const j = await apiGet();
      state.raw = j.data; state.role = j.role; state.mode='live'; state.error=''; state.syncedAt = new Date();
    }catch(e){
      state.mode='error'; state.error = String(e.message || e); state.raw = null; state.M = null;
      renderChrome(); renderView(); return;
    }
  }
  state.M = buildModel(state.raw);
  renderChrome(); renderView();
}
/* ---------- data model ---------- */
function buildModel(raw){
  const S = {}; (raw.settings||[]).forEach(r => S[r.key] = r.value);
  const positions = (raw.register||[]).map(r => ({
    ...r, position_id:String(r.position_id).trim(), reports_to_id:String(r.reports_to_id||'').trim(),
    sanctioned_hc:num(r.sanctioned_hc)||0, current_hc:num(r.current_hc)||0, incoming_hc:num(r.incoming_hc)||0, to_hire_hc:num(r.to_hire_hc)||0,
    employee:String(r.employee||'').trim(), role_tier:String(r.role_tier||'').trim()
  }));
  const byId = new Map(positions.map(p => [p.position_id, p]));
  const kids = new Map();
  positions.forEach(p => { if(p.reports_to_id){ if(!kids.has(p.reports_to_id)) kids.set(p.reports_to_id,[]); kids.get(p.reports_to_id).push(p); } });
  const tiers = {}; (raw.tierRules||[]).forEach(t => tiers[t.tier] = {...t, w_kpi:num(t.w_kpi)||0, w_comp:num(t.w_comp)||0, w_conduct:num(t.w_conduct)||0, w_dev:num(t.w_dev)||0});
  const sc = new Map((raw.scorecard||[]).map(r => {
    const o = {...r, position_id:String(r.position_id).trim()};
    DIMS.forEach(d => o[d.key] = num(r[d.key]));
    o.calibrated_score = num(r.calibrated_score);
    return [o.position_id, o];
  }));
  const M = {S, positions, byId, kids, tiers, sc, kpis: raw.kpiLibrary||[], dev: (raw.devPlans||[]).map(d => ({...d, completion_pct:num(d.completion_pct)||0}))};
  M.departments = [...new Set(positions.map(p => p.department))];
  M.bands = [
    {min:num(S.band_outstanding_min)??4.5, label:'Outstanding', cls:'ok'},
    {min:num(S.band_exceeds_min)??3.5, label:'Exceeds Expectations', cls:'ok'},
    {min:num(S.band_meets_min)??2.5, label:'Meets Expectations', cls:'info'},
    {min:num(S.band_improve_min)??1.5, label:'Improvement Required', cls:'warn'},
    {min:-Infinity, label:'Unsatisfactory', cls:'bad'}
  ];
  M.matrix = new Map();
  positions.filter(isEligible).forEach(p => M.matrix.set(p.position_id, routing(M,p)));
  return M;
}
const isEligible = p => p.org_status === 'Current';
const isAuthority = p => p.org_status === 'Current' || p.org_status === 'Not in HR data';
function personName(p){
  if(!p) return '';
  if(p.org_status==='Not in HR data') return p.position+' (name TBC)';
  if(!p.employee || p.employee.startsWith('(')) return p.org_status==='Current' ? 'Name not recorded' : 'Vacant';
  return p.employee;
}
function effective(M, id){            // first filled position at or above id
  const seen = new Set();
  while(id && !seen.has(id)){
    seen.add(id); const p = M.byId.get(id); if(!p) return null;
    if(isAuthority(p)) return p; id = p.reports_to_id;
  }
  return null;
}
function ancestors(M, p){ const out=[], seen=new Set([p.position_id]); let id=p.reports_to_id; while(id && !seen.has(id)){ seen.add(id); const q=M.byId.get(id); if(!q) break; out.push(q); id=q.reports_to_id; } return out; }
function deptHead(M, p){             // nominal head of department = nearest HOD-tier ancestor
  if(p.role_tier==='HOD' || p.role_tier==='Leadership') return null;
  const h = ancestors(M,p).find(a => a.role_tier==='HOD');
  return h ? effective(M,h.position_id) : null;
}
function routing(M, p){
  const nominal = M.byId.get(p.reports_to_id) || null;
  const primary = p.reports_to_id ? effective(M, p.reports_to_id) : null;
  const escalated = !!(primary && nominal && primary.position_id !== nominal.position_id);
  const missing = !p.reports_to_id || !primary;
  const rule = M.tiers[p.role_tier] || {};
  const up = q => q ? effective(M, q.reports_to_id) : null;
  const token = t => ({COO:()=>effective(M,'COO'), CEO:()=>M.byId.get('CEO')||null, HOD:()=>deptHead(M,p), MGR_OF_PRIMARY:()=>up(primary)}[t]||(()=>null))();
  const distinct = (tok, exclude) => {
    let r = token(tok) || up(primary);
    let guard = 0;
    while(r && exclude.includes(r.position_id) && guard++ < 10) r = up(r);
    return r;
  };
  const secondary = distinct(rule.secondary_rule, [p.position_id, primary && primary.position_id]);
  const finalA = distinct(rule.final_rule, [p.position_id]);
  const hrbp = effective(M,'HRBP');
  const calibrator = hrbp && hrbp.position_id !== p.position_id ? hrbp : effective(M,'COO');
  const verifier = (() => { const h = deptHead(M,p); return h && h.position_id !== p.position_id ? h : primary; })();
  const appeals = hrbp && hrbp.position_id !== p.position_id ? hrbp : effective(M,'COO');
  return {nominal, primary, escalated, missing, secondary, finalA, calibrator, verifier, appeals, rule,
          secondaryNote: (!secondary && primary && primary.position_id==='CEO') ? 'Board / Directors (if delegated)' : ''};
}

/* ---------- scoring ---------- */
function bandFor(M, score){ if(score==null) return null; return M.bands.find(b => score >= b.min); }
function computeScore(M, p, row){
  const t = M.tiers[p.role_tier]; if(!t || !row) return null;
  const vals = DIMS.map(d => row[d.key]);
  if(vals.some(v => v==null || v<1 || v>5)) return null;
  const wsum = DIMS.reduce((a,d) => a + t[d.w], 0); if(!wsum) return null;
  return Math.round(DIMS.reduce((a,d,i) => a + vals[i]*t[d.w], 0) / wsum * 100) / 100;
}
function appraisal(M, p){
  const row = M.sc.get(p.position_id) || {};
  const raw = computeScore(M,p,row);
  const final = row.calibrated_score!=null ? row.calibrated_score : raw;
  const status = row.review_status || 'Not Started';
  return {row, raw, final, band:bandFor(M,final), status, isFinal: FINAL_STATUSES.includes(status), complete: raw!=null};
}

/* ---------- data-health checks ---------- */
function healthChecks(M){
  const out = [];
  const add = (sev, title, desc, items=[]) => out.push({sev, title, desc, items});
  const P = M.positions;
  const dup = P.map(p=>p.position_id).filter((id,i,a)=>a.indexOf(id)!==i);
  add(dup.length?'bad':'ok','Position IDs are unique', dup.length?'Duplicate IDs break reporting lines.':'Every position has its own ID.', [...new Set(dup)]);
  const missing = P.filter(p => p.position_id!=='CEO' && !p.reports_to_id);
  add(missing.length?'bad':'ok','Every position has a reporting line', missing.length?'No reporting manager recorded. Evaluators cannot be routed until fixed.':'All positions (except the CEO) report to a position.', missing.map(p=>`${p.position_id}: ${p.position}${p.reports_to_label?' (source said: '+p.reports_to_label+')':''}`));
  const broken = P.filter(p => p.reports_to_id && !M.byId.has(p.reports_to_id));
  add(broken.length?'bad':'ok','Reporting lines point to real positions', broken.length?'Reports-to ID not found in the Register.':'No broken references.', broken.map(p=>`${p.position_id} -> ${p.reports_to_id}`));
  const loops = P.filter(p => { const seen=new Set([p.position_id]); let id=p.reports_to_id; while(id){ if(seen.has(id)) return true; seen.add(id); const q=M.byId.get(id); if(!q) break; id=q.reports_to_id; } return false; });
  add(loops.length?'bad':'ok','No circular reporting chains', loops.length?'A position reports (directly or indirectly) to itself.':'All chains end at the top of the organisation.', loops.map(p=>p.position_id));
  const conflict = P.filter(p => (p.filled_flag==='Filled' && p.org_status==='Projected') || (p.filled_flag==='Vacant' && p.org_status==='Current'));
  add(conflict.length?'warn':'ok','Filled / vacant flag matches Org Status', conflict.length?'The source marks these differently. They are treated according to Org Status.':'No conflicts.', conflict.map(p=>`${p.position_id}: ${p.position} (flag ${p.filled_flag}, status ${p.org_status})${p.remarks?' - '+p.remarks:''}`));
  const noName = P.filter(p => p.org_status==='Current' && (!p.employee || p.employee.startsWith('(')));
  add(noName.length?'warn':'ok','Current positions have named employees', noName.length?'Appraisals are tracked per position until names are added.':'All current positions have names.', noName.map(p=>`${p.position_id}: ${p.position} x${p.current_hc} (${p.employee||'blank'})`));
  const esc2 = [...M.matrix.entries()].filter(([,r]) => r.escalated).map(([id,r]) => `${id} evaluated by ${personName(r.primary)} (${r.primary.position}) because ${r.nominal.position} is vacant`);
  add(esc2.length?'info':'ok','Evaluators reached by escalation', esc2.length?'The nominal supervisor is vacant, so the review goes to the next filled position above.':'No escalations needed.', esc2);
  const noEval = [...M.matrix.entries()].filter(([,r]) => r.missing).map(([id]) => id);
  add(noEval.length?'bad':'ok','Every current employee has an evaluator', noEval.length?'No evaluator could be resolved.':'All current employees resolve to an evaluator.', noEval);
  const badTier = P.filter(p => p.position_id!=='CEO' && !M.tiers[p.role_tier]);
  add(badTier.length?'bad':'ok','Every position has a valid role tier', badTier.length?'Role tier missing or not in Tier_Rules.':'Tiers map to scoring rules.', badTier.map(p=>p.position_id));
  const badW = Object.values(M.tiers).filter(t => t.w_kpi+t.w_comp+t.w_conduct+t.w_dev !== 100);
  add(badW.length?'bad':'ok','Scoring weights total 100% for each tier', badW.length?'Fix weights in the Tier_Rules tab.':'All tiers total 100%.', badW.map(t=>`${t.tier}: ${t.w_kpi+t.w_comp+t.w_conduct+t.w_dev}%`));
  const hc = P.filter(p => p.org_status!=='Not in HR data' && p.sanctioned_hc !== p.current_hc+p.incoming_hc+p.to_hire_hc);
  add(hc.length?'warn':'ok','Headcount reconciles (sanctioned = current + incoming + to hire)', hc.length?'These rows do not add up.':'All rows reconcile.', hc.map(p=>p.position_id));
  const noSc = P.filter(p => !M.sc.has(p.position_id)), orphan = [...M.sc.keys()].filter(id => !M.byId.has(id));
  add(noSc.length||orphan.length?'warn':'ok','Register and Scorecard tabs match', 'Each position needs one Scorecard row.', [...noSc.map(p=>'Missing scorecard: '+p.position_id), ...orphan.map(id=>'Scorecard row without position: '+id)]);
  const rated = P.filter(p => !isEligible(p) && M.sc.has(p.position_id) && (DIMS.some(d => M.sc.get(p.position_id)[d.key]!=null)));
  add(rated.length?'bad':'ok','No ratings on vacant or projected positions', rated.length?'Vacant positions must not be rated.':'No ratings against vacant positions.', rated.map(p=>p.position_id));
  const badR = [...M.sc.values()].filter(r => DIMS.some(d => r[d.key]!=null && (r[d.key]<1 || r[d.key]>5 || !Number.isInteger(r[d.key]))));
  add(badR.length?'bad':'ok','Ratings are whole numbers 1 to 5', badR.length?'Invalid ratings found.':'All entered ratings are valid.', badR.map(r=>r.position_id));
  const early = [...M.sc.values()].filter(r => { const i=STATUS_FLOW.indexOf(r.review_status); return i>=RATING_REQUIRED_FROM && DIMS.some(d => r[d.key]==null); });
  add(early.length?'bad':'ok','Late-stage reviews have complete ratings', early.length?'Status is past Manager Review but ratings are incomplete.':'No incomplete late-stage reviews.', early.map(r=>r.position_id));
  const future = P.filter(p => isEligible(p) && p.date_of_joining > today());
  add(future.length?'warn':'ok','Current employees have joined already', future.length?'Joining date is in the future.':'No future joining dates on current staff.', future.map(p=>`${p.position_id}: ${p.date_of_joining}`));
  return out;
}

function refreshScore(){
  const M = state.M, p = AF.p, row = {...AF.ratings};
  const raw = computeScore(M,p,row); const cs = num($('#cs')&&$('#cs').value);
  const fin = cs!=null ? cs : raw, band = bandFor(M,fin);
  $('#scoreBox').innerHTML = fin==null ? '<div><div class="big">-</div></div><div>Rate all four dimensions to calculate the weighted score.</div>'
    : `<div class="big">${fin.toFixed(2)}</div><div><b>${esc(band.label)}</b><div class="sub">${cs!=null?'Calibrated score. Weighted score from manager ratings: '+(raw!=null?raw.toFixed(2):'incomplete'):'Weighted score out of 5. Provisional until the review is acknowledged or closed.'}</div></div>`;
}
function saveAppraisal(){
  const M = state.M, {id,p} = AF, err = m => { $('#formErr').textContent = m; return false; };
  const f = {position_id:id, actual_evidence:$('#ev').value.trim(), manager_comments:$('#mc').value.trim(), development_action:$('#da').value.trim(),
    review_status:$('#rs').value, hr_moderation:$('#hm').value, calibration_note:$('#cn').value.trim(), review_date:today()};
  DIMS.forEach(d => f[d.key] = AF.ratings[d.key] ?? '');
  const cs = $('#cs').value; f.calibrated_score = cs==='' ? '' : Number(cs);
  const user = (state.conn.user||'').trim();
  if(state.mode==='live' && !user) return err('Enter your name in the gear (settings) dialog first. It is recorded in the audit log.');
  if(user && p.employee && user.toLowerCase()===p.employee.toLowerCase()) return err('You cannot change your own appraisal. Ask your evaluator to record it.');
  const rated = DIMS.map(d => f[d.key]).filter(v => v!=='');
  if(rated.some(v => v===1||v===5) && !f.actual_evidence && !f.manager_comments) return err('A rating of 1 or 5 needs evidence or a comment.');
  const idx = STATUS_FLOW.indexOf(f.review_status);
  if(idx>=RATING_REQUIRED_FROM && rated.length<4) return err('Rate all four dimensions before moving to '+f.review_status+'.');
  if(f.calibrated_score!=='' && (f.calibrated_score<1||f.calibrated_score>5)) return err('Calibrated score must be between 1 and 5.');
  if(f.calibrated_score!=='' && !f.calibration_note) return err('Add a calibration note explaining the change.');
  const btn = $('[data-act=saveappraisal]'); btn.disabled = true; btn.textContent = 'Saving...';
  const done = res => {
    const cur = M.sc.get(id) || {position_id:id}; Object.assign(cur, f, {updated_by:user||'demo', updated_at:(res&&res.row&&res.row.updated_at)||new Date().toISOString()});
    DIMS.forEach(d => cur[d.key] = num(f[d.key])); cur.calibrated_score = num(f.calibrated_score); M.sc.set(id,cur);
    $('#dlg').close(); toast('Appraisal saved'); renderView(); if($('#drawer').classList.contains('on')) openDrawer(id);
  };
  if(state.mode==='demo') return done();
  apiPost('saveScorecard', f).then(done).catch(e => { btn.disabled=false; btn.textContent='Save appraisal'; err('Could not save: '+e.message); });
}

/* ---------- development plan dialog ---------- */
function openDev(planId, positionId){
  const M = state.M; const d = planId ? M.dev.find(x => x.plan_id===planId) : null;
  const elig = M.positions.filter(isEligible);
  const pid = d ? d.position_id : (positionId || '');
  const defOwner = d ? d.owner : (pid && M.matrix.get(pid) && M.matrix.get(pid).primary ? personName(M.matrix.get(pid).primary) : '');
  const ro = state.role==='viewer' ? 'disabled' : '';
  $('#dlg').innerHTML = `<form method="dialog"><div class="dh"><h3>${d?'Edit':'New'} development plan</h3><button type="button" class="btn sm" style="margin-left:auto" data-act="closedlg">Close</button></div>
   <div class="db"><div class="f"><label for="dp">Employee</label><select id="dp" ${ro}><option value="">Select...</option>${elig.map(p=>`<option value="${esc(p.position_id)}" ${p.position_id===pid?'selected':''}>${esc(personName(p))} - ${esc(p.position)}</option>`).join('')}</select></div>
    <div class="f"><label for="dg">Performance gap or objective</label><textarea id="dg" ${ro}>${esc(d?d.gap:'')}</textarea></div>
    <div class="f"><label for="dac">Action or training</label><textarea id="dac" ${ro}>${esc(d?d.action:'')}</textarea></div>
    <div class="f2"><div class="f"><label for="do">Owner</label><input type="text" id="do" value="${esc(defOwner)}" ${ro}></div><div class="f"><label for="dd">Due date</label><input type="date" id="dd" value="${esc(d?d.due_date:'')}" ${ro}></div></div>
    <div class="f2"><div class="f"><label for="dc">Completion %</label><input type="number" id="dc" min="0" max="100" value="${d?d.completion_pct:0}" ${ro}></div><div class="f"><label for="ds">Status</label><select id="ds" ${ro}>${DEV_STATUSES.map(s=>`<option ${d&&d.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
    <div class="f"><label for="de">Success measure or evidence</label><input type="text" id="de" value="${esc(d?d.evidence:'')}" ${ro}></div><div class="err" id="formErr" role="alert"></div></div>
   <div class="df"><button type="button" class="btn" data-act="closedlg">Cancel</button>${ro?'':`<button type="button" class="btn primary" data-act="savedev" data-plan="${esc(planId||'')}">Save plan</button>`}</div></form>`;
  $('#dlg').showModal();
}
function saveDev(planId){
  const M = state.M, err = m => { $('#formErr').textContent = m; };
  const f = {plan_id:planId||'', position_id:$('#dp').value, gap:$('#dg').value.trim(), action:$('#dac').value.trim(), owner:$('#do').value.trim(), due_date:$('#dd').value, completion_pct:Number($('#dc').value)||0, status:$('#ds').value, evidence:$('#de').value.trim()};
  if(!f.position_id||!f.gap||!f.action) return err('Employee, gap and action are required.');
  if(f.completion_pct<0||f.completion_pct>100) return err('Completion must be 0 to 100.');
  const user = (state.conn.user||'').trim();
  if(state.mode==='live' && !user) return err('Enter your name in the settings dialog first.');
  const done = res => {
    if(!f.plan_id) f.plan_id = (res&&res.row&&res.row.plan_id) || 'DP-'+Date.now();
    const i = M.dev.findIndex(x => x.plan_id===f.plan_id); if(i>=0) Object.assign(M.dev[i], f); else M.dev.push({...f});
    $('#dlg').close(); toast('Development plan saved'); renderView();
  };
  if(state.mode==='demo') return done();
  apiPost('saveDevPlan', f).then(done).catch(e => err('Could not save: '+e.message));
}

/* ---------- connection settings dialog ---------- */
function openSettings(){
  $('#dlg').innerHTML = `<form method="dialog"><div class="dh"><div><h3>Connection settings</h3><div class="sub">Stored in this browser only</div></div><button type="button" class="btn sm" style="margin-left:auto" data-act="closedlg">Close</button></div>
   <div class="db"><div class="f"><label for="cu">Apps Script Web app URL</label><input type="text" id="cu" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(state.conn.url)}"><span class="h">Leave empty to use demo data.</span></div>
    <div class="f"><label for="ck">Access key</label><input type="password" id="ck" value="${esc(state.conn.key)}" autocomplete="off"><span class="h">View key for read-only access, edit key to save appraisals.</span></div>
    <div class="f"><label for="cn2">Your name</label><input type="text" id="cn2" value="${esc(state.conn.user)}" autocomplete="name"><span class="h">Recorded in the audit log. Used to block editing your own appraisal.</span></div></div>
   <div class="df"><button type="button" class="btn" data-act="closedlg">Cancel</button><button type="button" class="btn primary" data-act="saveconn">Save and reload</button></div></form>`;
  $('#dlg').showModal();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(act==='tog'){ e.stopPropagation(); state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id); return renderView(); }
  if(act==='pos'){ e.preventDefault(); return openDrawer(id); }
  if(act==='nav') return setView(id);
  if(act==='menu') return $('#side').classList.toggle('on');
  if(act==='refresh') return load().then(()=> state.mode==='live' && toast('Data reloaded'));
  if(act==='settings') return openSettings();
  if(act==='usedemo'){ state.conn.url=''; localStorage.setItem(LS,JSON.stringify(state.conn)); return load(); }
  if(act==='closedrawer') return closeDrawer();
  if(act==='closedlg') return $('#dlg').close();
  if(act==='expand'){ state.collapsed.clear(); return renderView(); }
  if(act==='collapse'){ state.M.kids.forEach((v,k) => state.collapsed.add(k)); return renderView(); }
  if(act==='sort'){ const t=el.dataset.t,k=el.dataset.k, s=state.sort[t]; state.sort[t] = s&&s.k===k ? {k,dir:-s.dir} : {k,dir:1}; return renderView(); }
  if(act==='appraise'){ closeDrawer(); return openAppraisal(id); }
  if(act==='rate'){ if(AF.readonly) return; const k=el.dataset.dim, n=Number(el.dataset.n); AF.ratings[k] = AF.ratings[k]===n ? null : n; $$('[data-dim="'+k+'"] button').forEach(b => b.classList.toggle('on', Number(b.dataset.n)===AF.ratings[k])); return refreshScore(); }
  if(act==='saveappraisal') return saveAppraisal();
  if(act==='newdev'){ closeDrawer(); return openDev('', id||''); }
  if(act==='editdev') return openDev(id,'');
  if(act==='savedev') return saveDev(el.dataset.plan);
  if(act==='saveconn'){ state.conn = {url:$('#cu').value.trim(), key:$('#ck').value.trim(), user:$('#cn2').value.trim()}; localStorage.setItem(LS,JSON.stringify(state.conn)); $('#dlg').close(); return load(); }
  const M = state.M;
  if(act==='csv-pos') return downloadCSV('positions.csv', M.positions.filter(inDept).map(p => ({position_id:p.position_id,position:p.position,department:p.department,sub_department:p.sub_department,tier:p.role_tier,org_status:p.org_status,employee:personName(p),reports_to:(M.byId.get(p.reports_to_id)||{}).position||'',sanctioned_hc:p.sanctioned_hc,joined:p.date_of_joining})));
  if(act==='csv-app') return downloadCSV('appraisals.csv', M.positions.filter(p=>isEligible(p)&&inDept(p)).map(p => { const a=appraisal(M,p), r=M.matrix.get(p.position_id); return {position_id:p.position_id,employee:personName(p),position:p.position,department:p.department,tier:p.role_tier,evaluator:r.primary?personName(r.primary):'',status:a.status,weighted_score:a.raw??'',final_score:a.final??'',band:a.band?a.band.label:''}; }));
  if(act==='csv-mx') return downloadCSV('feedback_approval_matrix.csv', matrixRows(M).map(({p,r}) => ({position_id:p.position_id,employee:personName(p),position:p.position,department:p.department,tier:p.role_tier,feedback_model:r.rule.feedback_model||'',self_appraisal:personName(p),primary_evaluator:r.primary?personName(r.primary):'',kpi_evidence_check:r.verifier?personName(r.verifier):'',second_level_review:r.secondary?personName(r.secondary):(r.secondaryNote||'TBC'),calibration:r.calibrator?personName(r.calibrator):'',final_approval:r.finalA?personName(r.finalA):'',appeals:r.appeals?personName(r.appeals):'',escalated:r.escalated?'Yes':'No'})));
  if(act==='csv-kpi') return downloadCSV('kpi_library.csv', M.kpis.filter(inDept));
});
document.addEventListener('input', e => { if(e.target.id==='q'){ state.q = e.target.value; const pos=e.target.selectionStart; renderView(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); } if(e.target.id==='cs' && AF) refreshScore(); });
document.addEventListener('change', e => {
  if(e.target.id==='deptSel'){ state.dept = e.target.value; renderView(); }
  if(e.target.id==='fOrg'){ state.fOrg = e.target.value; renderView(); }
  if(e.target.id==='fStatus'){ state.fStatus = e.target.value; renderView(); }
});
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });
renderChrome();
load();
</script>
</body>
</html>
